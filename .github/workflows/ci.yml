name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        eslint: [9, 10]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci

      - name: Install ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 9
        run: npm install --no-save --package-lock=false eslint@${{ matrix.eslint }}

      - name: Lint source and tests
        run: npm run lint

      - name: Run type checks and Vitest
        run: npm run test:all

  required-checks:
    name: Required CI checks
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the full matrix to pass
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: test "$MATRIX_RESULT" = success
